name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

# 避免重复触发时多个部署并发互相覆盖
concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install -g wrangler@latest

      # 1) 先部署实时同步中枢 Worker（SyncHub Durable Object + /api/sync/* 路由）
      - name: Deploy SyncHub Worker
        working-directory: sync-hub-worker
        run: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # 2) 再部署 Pages（前端 public/ + Pages Functions api/）
      - name: Deploy Pages
        run: wrangler pages deploy public --project-name review-system
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
