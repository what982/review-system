name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

# 避免重复触发时多个部署并发互相覆盖
concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 显式拉取 main 分支（非 detached HEAD），wrangler 才能识别为生产分支并部署到 production 环境
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install -g wrangler@latest

      # 1) 先部署实时同步中枢 Worker（SyncHub Durable Object + /api/sync/* 路由）
      - name: Deploy SyncHub Worker
        working-directory: sync-hub-worker
        run: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # 2) 再部署 Pages 到 production 环境（生产分支已设为 main，且 checkout ref:main 保证识别正确）
      - name: Deploy Pages
        run: wrangler pages deploy public --project-name review-system --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
